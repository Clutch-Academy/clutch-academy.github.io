<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clutch Academy — live games</title>
<meta name="description" content="Live audience games for Clutch Academy sessions.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<style>
:root{--bg:#F1EDF8;--panel:#FFFFFF;--heading:#550E30;--accent:#FF464C;--line:#DCDCDC;--muted:#6B5A63;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--heading);font-family:'Circular','Poppins',Helvetica,Arial,sans-serif;
 padding:48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:620px;margin:0 auto}
.eyebrow{display:inline-block;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;
 letter-spacing:.09em;text-transform:uppercase;padding:6px 14px;border-radius:999px}
h1{font-size:clamp(1.8rem,6vw,2.6rem);margin:12px 0 6px;font-weight:700;line-height:1.08}
p.lead{color:var(--muted);margin:0 0 28px}
a.card{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);
 border-radius:16px;padding:20px 22px;color:var(--heading);margin-bottom:14px}
a.card:hover{border-color:var(--accent)}
a.card h2{margin:0 0 6px;font-size:1.2rem;font-weight:700}
a.card span{display:block;color:var(--muted);font-size:.92rem;font-weight:400}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">Clutch Academy</span>
  <h1>Live session games</h1>
  <p class="lead">Audience games you run from the front of the room.</p>
  <a class="card" href="mascot-host/"><h2>Name the Mascot — presenter</h2><span>Open this on the presentation laptop. Shows the QR code and the controls.</span></a>
  <a class="card" href="mascot/"><h2>Name the Mascot — players</h2><span>Where the QR code sends everyone. Nothing to do here without a live game.</span></a>
</div>
</body>
</html>
